<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mikazuki Resure Reservation Status</title>

  <!-- 既存のスタイル（任意で使用） -->
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <!-- 操作用ボタン群 -->
  <div class="control-buttons" id="controlButtons">
    <button onclick="toggleFullScreen()">画面切替</button>
    <button onclick="setAllButtons('〇')">すべてを〇にする</button>
    <button onclick="setAllButtons('×')">すべてを×にする</button>
    <button onclick="setAllButtons('ー')">すべてをーにする</button>
    <button onclick="toggleSwitchScreen(this)">自動遷移を停止</button>
    <button onclick="nextScreen()">次ページへ</button>
  </div>

  <div class="container" id="container">
    <!-- ① アーゴ画面 -->
    <div class="screen active" id="argo_screen">
      <span onclick="toggleControlButtons()">
        <img src="image/argo_image.png" alt="アーゴ陸上探検ツアー" class="argo_image"/>
      </span>
      <div class="column-subtitle">本日の運行状況</div>

      <div class="seat-status">
        <span class="available">〇<br>空席　　</span>
        <span class="full">×<br>満席　　</span>
        <span class="unavailable">ー<br>利用不可</span>
      </div>

      <div class="column-subtitle">３歳からご利用可能</div>

      <!-- スロット自動描画エリア（JSが埋め込む） -->
      <div class="box" id="argo_times"></div>
    </div>

    <!-- ② バギー画面 -->
    <div class="screen" id="buggy_screen">
      <span onclick="toggleControlButtons()">
        <img src="image/buggy_image.png" alt="周回コース" class="buggy_image"/>
      </span>
      <div class="column-title">フィールドバギー</div>

      <div class="column-subtitle">本日の運行状況</div>
      <div class="seat-status">
        <span class="available">〇<br>空席　　</span>
        <span class="full">×<br>満席　　</span>
        <span class="few-seats">△<br>台数制限</span>
        <span class="unavailable">ー<br>利用不可</span>
      </div>

      <div class="column-subtitle">15分前受付締め切り</div>

      <!-- スロット自動描画エリア（JSが埋め込む） -->
      <div class="buggy_box" id="buggy_times"></div>
    </div>

    <!-- ③ ドラゴンサーキット画面 -->
    <div class="screen" id="dragon_circuit_screen">
      <span onclick="toggleControlButtons()">
        <img src="image/dragon_circuit_image.png" alt="ドラゴンサーキット" class="dragon_circuit_image"/>
      </span>
      <div class="column-title">只今の待ち時間</div>
      <div class="wait-time" id="dragon_wait_time" onclick="toggleWaitTime()">0分</div>
    </div>

    <!-- ④ ナビゲーション（案内）画面 -->
    <div class="screen" id="navigation_screen">
      <div class="navigation-layout">
        <!-- 左：ドラゴンサーキット -->
        <div class="nav-left">
          <span onclick="toggleControlButtons()">
            <img src="image/dragon_circuit_image.png" alt="ドラゴンサーキット" class="dragon_circuit_image nav-image"/>
          </span>

          <div class="nav-card">
            <div class="nav-label">ドラゴンサーキット受付</div>
            <div class="nav-arrow" aria-hidden="true">
              <svg class="arrow arrow-left" viewBox="0 0 64 64">
                <path d="M56 32H16" />
                <path d="M28 16L8 32 28 48" />
              </svg>
            </div>
          </div>
        </div>

        <!-- 右：アーゴ＋バギー -->
        <div class="nav-right">
          <span onclick="toggleControlButtons()">
            <img src="image/argo_image.png" alt="アーゴ陸上探検ツアー" class="argo_image nav-image nav-image-small"/>
          </span>
          <span onclick="toggleControlButtons()">
            <img src="image/buggy_image.png" alt="フィールドバギー" class="buggy_image nav-image nav-image-small"/>
          </span>

          <div class="nav-card">
            <div class="nav-label">バギー・アーゴ受付</div>
            <div class="nav-arrow" aria-hidden="true">
              <svg class="arrow arrow-right" viewBox="0 0 64 64">
                <path d="M8 32H48" />
                <path d="M36 16L56 32 36 48" />
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div><!-- /navigation_screen -->
  </div><!-- /container -->

  <!-- 既存の動作用スクリプト -->
  <script src="script/switchScreen.js" defer></script>
  <script src="script/controlButton.js" defer></script>
  <script src="script/toggleButton.js" defer></script>

  <!-- YAML パーサ（YAMLで運用する場合は必須。JSON運用なら不要） -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js" defer></script>

  <!-- スケジュール読み込み＆自動描画 -->
  <script src="script/loadSchedule.js" defer></script>
</body>
</html>
